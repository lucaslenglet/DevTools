[package]
name = "devtools"
version = "0.1.0"
edition = "2021"
description = "Terminal Git repository browser and launcher"
license = "MIT"

[[bin]]
name = "devtools"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
gix = { version = "0.87", default-features = false, features = ["max-performance-safe", "basic", "revision", "sha1"] }
rayon = "1"
dirs = "5"
chrono = "0.4"
unicode-width = "0.2"
anyhow = "1"

[profile.release]
lto = true
strip = true
